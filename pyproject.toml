[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-decision-memory"
version = "0.1.0"
description = "Human-reviewed personal decision memory for Codex and Obsidian"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = ["mcp>=2.3,<3", "pydantic>=2.10,<3", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
decision-memory = "decision_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
decision_memory = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

